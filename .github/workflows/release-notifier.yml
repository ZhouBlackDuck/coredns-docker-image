name: Release Notifier

on:
  workflow_dispatch:
  schedule:
    # 每周一 UTC 00:05 检查上游是否有新 release
    - cron: "35 5 * * *"

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Check upstream release
        uses: maheshrayas/action-release-notifier@v2.1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          type: Github
          repo: "https://github.com/dokku/coredns-docker"
          days: 7
          labels: "upstream-release"
