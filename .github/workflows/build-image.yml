name: Build and Push Docker Image

on:
  # 在 Release Notifier 完成后自动触发
  workflow_run:
    workflows: ["Release Notifier"]
    types: [completed]
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest
    # 仅在 release-notifier 成功完成时运行（workflow_dispatch 时始终运行）
    if: |
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    permissions:
      contents: read
      packages: write
      issues: write

    steps:
      - name: Find open upstream-release issues
        id: find_issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 查找由 github-actions[bot] 创建的带 upstream-release 标签的 open issue
          ISSUES=$(gh issue list \
            --repo "${{ github.repository }}" \
            --label "upstream-release" \
            --state open \
            --json number,title,author \
            --jq '[.[] | select(.author.login == "github-actions[bot]")]')

          echo "$ISSUES"
          gh issue list --repo "${{ github.repository }}" --label "upstream-release" --state open --json number,title,author

          COUNT=$(echo "$ISSUES" | jq 'length')
          if [ "$COUNT" -eq 0 ]; then
            echo "No open upstream-release issues found."
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # 取最新的一个 issue
          ISSUE_TITLE=$(echo "$ISSUES" | jq -r '.[0].title')
          ISSUE_NUMBER=$(echo "$ISSUES" | jq -r '.[0].number')
          echo "Found issue #${ISSUE_NUMBER}: ${ISSUE_TITLE}"
          echo "found=true" >> "$GITHUB_OUTPUT"
          echo "issue_title=${ISSUE_TITLE}" >> "$GITHUB_OUTPUT"
          echo "issue_number=${ISSUE_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Extract upstream release tag from issue
        if: steps.find_issue.outputs.found == 'true'
        id: extract_tag
        run: |
          ISSUE_TITLE="${{ steps.find_issue.outputs.issue_title }}"
          # 标题格式: "New Version of coredns-docker <tag> available"
          UPSTREAM_TAG=$(echo "$ISSUE_TITLE" | grep -oP '[\d]+\.[\d]+\.[\d]+' | head -1)
          if [ -z "$UPSTREAM_TAG" ]; then
            echo "::error::Cannot extract tag from issue title: $ISSUE_TITLE"
            exit 1
          fi
          echo "tag=${UPSTREAM_TAG}" >> "$GITHUB_OUTPUT"
          echo "Detected upstream tag: ${UPSTREAM_TAG}"

      - name: Check if tag already exists in registry
        if: steps.find_issue.outputs.found == 'true'
        id: check_tag
        env:
          TAG: ${{ steps.extract_tag.outputs.tag }}
        run: |
          REPO="${{ github.repository }}"
          IMAGE="ghcr.io/${REPO,,}"
          # 尝试检查 manifest，如果已存在则跳过
          if docker manifest inspect "${IMAGE}:${TAG}" > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Tag ${TAG} already exists, skipping build."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Tag ${TAG} is new, proceeding with build."
          fi

      - name: Checkout repository
        if: steps.find_issue.outputs.found == 'true' && steps.check_tag.outputs.exists == 'false'
        uses: actions/checkout@v4

      - name: Set up QEMU
        if: steps.find_issue.outputs.found == 'true' && steps.check_tag.outputs.exists == 'false'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        if: steps.find_issue.outputs.found == 'true' && steps.check_tag.outputs.exists == 'false'
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        if: steps.find_issue.outputs.found == 'true' && steps.check_tag.outputs.exists == 'false'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download upstream binaries
        if: steps.find_issue.outputs.found == 'true' && steps.check_tag.outputs.exists == 'false'
        env:
          TAG: ${{ steps.extract_tag.outputs.tag }}
        run: |
          BASE_URL="https://github.com/dokku/coredns-docker/releases/download/${TAG}"
          mkdir -p binaries/linux-amd64 binaries/linux-arm64

          echo "Downloading coredns-docker-linux-amd64..."
          curl -fsSL -o binaries/linux-amd64/coredns "${BASE_URL}/coredns-docker-linux-amd64"
          chmod +x binaries/linux-amd64/coredns

          echo "Downloading coredns-docker-linux-arm64..."
          curl -fsSL -o binaries/linux-arm64/coredns "${BASE_URL}/coredns-docker-linux-arm64"
          chmod +x binaries/linux-arm64/coredns

      - name: Build and push Docker images
        if: steps.find_issue.outputs.found == 'true' && steps.check_tag.outputs.exists == 'false'
        env:
          TAG: ${{ steps.extract_tag.outputs.tag }}
        run: |
          REPO="${{ github.repository }}"
          IMAGE="ghcr.io/${REPO,,}"

          # 构建 amd64 镜像
          docker buildx build \
            --platform linux/amd64 \
            --build-arg TARGETARCH=amd64 \
            --tag "${IMAGE}:${TAG}-amd64" \
            --push \
            .

          # 构建 arm64 镜像
          docker buildx build \
            --platform linux/arm64 \
            --build-arg TARGETARCH=arm64 \
            --tag "${IMAGE}:${TAG}-arm64" \
            --push \
            .

          # 创建并推送 multi-arch manifest
          docker buildx imagetools create \
            --tag "${IMAGE}:${TAG}" \
            --tag "${IMAGE}:latest" \
            "${IMAGE}:${TAG}-amd64" \
            "${IMAGE}:${TAG}-arm64"

      - name: Close issue
        if: always() && steps.find_issue.outputs.found == 'true' && steps.extract_tag.outputs.tag != ''
        uses: peter-evans/close-issue@v3
        with:
          issue-number: ${{ steps.find_issue.outputs.issue_number }}
          comment: |
            ✅ Docker image built and pushed for tag `${{ steps.extract_tag.outputs.tag }}`.

            Images:
            - `ghcr.io/${{ github.repository }}:${{ steps.extract_tag.outputs.tag }}`
            - `ghcr.io/${{ github.repository }}:${{ steps.extract_tag.outputs.tag }}-amd64`
            - `ghcr.io/${{ github.repository }}:${{ steps.extract_tag.outputs.tag }}-arm64`
